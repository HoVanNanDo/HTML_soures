<!DOCTYPE html>
<html>
<head>
    <title>Danh sách học bổng</title>

    <meta name="robots" content="noindex">
    <meta name="googlebot" content="noindex">

    <style>
        h3 {
            text-align: center;
        }

        table {
            margin: 0 auto;
            border-collapse: collapse;
            width: 70%;
        }

        th, td {
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        th {
            color: blue;
            font-size: 25px;
        }

        td {
            font-size: 14px;
        }

        tbody tr:nth-child(1) {
            background-color: #ffe6e6;
        }

        tbody tr:nth-child(1):hover {
            background-color: #ff9999;
        }

        tbody tr:nth-child(2) {
            background-color: #e6f2ff;
        }

        tbody tr:nth-child(2):hover {
            background-color: #80bfff;
        }

        tbody tr:nth-child(3) {
            background-color: #e6ffe6;
        }

        tbody tr:nth-child(3):hover {
            background-color: #80ff80;
        }

        tbody tr {
            transition: 0.3s;
        }
    </style>
</head>

<body>

    <h3>1) Dưới đây là danh sách sinh viên được nhận học bổng:</h3>

    <table>
        <thead>
            <tr>
                <th>Họ tên</th>
                <th>Ngày sinh</th>
                <th>Giới tính</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Kiều Thị Thu Hằng</td>
                <td>04/09/1991</td>
                <td>Nữ</td>
            </tr>

            <tr>
                <td>Trần Anh Đức</td>
                <td>03/08/1993</td>
                <td>Nam</td>
            </tr>

            <tr>
                <td>Vương Thị Lê Na</td>
                <td>06/10/1991</td>
                <td>Nữ</td>
            </tr>
        </tbody>
    </table>

    <h3>2) Và đây là chân dung của sinh viên xuất sắc nhất:</h3>

    <img src="http://webcoban.vn/image/face.png"
        style="width:200px; display:block; margin:auto;">

</body>
</html>
